worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    upstream backend {
        server web-app-1:5000;
        server web-app-2:5000;
        keepalive 256;
    }

    server {
        listen 80 backlog=4096;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
