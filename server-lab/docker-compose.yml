services:
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - web-app-1
      - web-app-2

  web-app-1:
    build: .
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - redis-db

  web-app-2:
    build: .
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - redis-db

  redis-db:
    image: redis:alpine
    command: redis-server --save "" --appendonly no
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - '-nginx.scrape-uri=http://nginx-proxy/stub_status'
    depends_on:
      - nginx-proxy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nginx-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      - prometheus
